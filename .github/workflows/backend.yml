name: Backend

# Solo se ejecuta si cambia el backend: evita gastar minutos de Actions
# reconstruyéndolo cuando el cambio es únicamente del frontend.
on:
  push:
    branches: [main]
    paths:
      - 'oratgeBack/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'oratgeBack/**'
      - '.github/workflows/backend.yml'

# Si se pushea dos veces seguidas, cancela la ejecución anterior.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compilar y pasar los tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oratgeBack

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Sin esta caché cada ejecución se descargaría medio Maven Central.
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      # Los tests no necesitan el .env ni salen a la red: el cliente de AEMET
      # se prueba con MockRestServiceServer y los de contexto inyectan las
      # claves por properties.
      - name: Compilar y pasar los tests
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publicar los informes de test si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: oratgeBack/**/target/surefire-reports/
          retention-days: 7
